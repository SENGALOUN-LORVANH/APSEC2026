frozen_commit: c3335ecc19b486e89c011db76d0537040cce34d5

authoritative_machine:
  host: lab PC (native Ubuntu preferred; WSL2 Ubuntu acceptable)
  environment_record: results/environment.json
  mac_usage: coding, git, inspection, small engineering tests only

dataset:
  source: Zenodo 3730599 Patches.zip
  archive_md5: 11203b88e6ae8a657757c6b5842d5a46
  manifest_sha256: 2ae3a159b2b31526557745146b6960645ecfe44212ecf4cd0a14aabf816dd21c
  label_policy_primary: configs/label_policy_primary.yaml
  label_policy_sensitivity: configs/label_policy_sensitivity.yaml
  # sha256(primary_bytes + sensitivity_bytes), in that order
  label_policy_file_sha256: d67c89d69144f53f466090003be3361679574d9ce1c40851d79f979103e5b86d
  duplicates:
    primary: retain all candidate records
    sensitivity: collapse byte-identical normalized diffs within the same bug (keep first patch_id in sorted order)
  normalization: trailing-whitespace hunk rebuild, applied only if it reduces changed lines; verified per patch

defects4j:
  # Decided by authors 2026-09-15 (before any execution).
  version: v2.0.1
  commit: a83e47921152721569cb95d6d7b91c4be277d940
  jdk_for_projects: 8
  unavailable_bug_status: ENVIRONMENT_UNAVAILABLE_PRIMARY   # e.g. deprecated Closure-63, Closure-93; never dropped
  no_per_bug_version_switching: true
  compatibility_analysis: "v3.0.1 (6d54320, JDK 11) only as a separately reported sensitivity analysis, after verifying patch applicability, trigger-test semantics, and bug-definition compatibility"
  jdk_for_analysis_tools: 21
  patch_application: "patch -p? --dry-run first; no fuzz; record patch_applies"
  test_timeout_seconds: 60
  repetitions_per_execution: 3

llm:
  candidates:
    - {model: claude-haiku-4-5, settings: {temperature: 0.0}}
    - {model: claude-sonnet-5, settings: {effort: medium}}
  selected_model: PENDING_PILOT_SELECTION  # see note above frozen: true -- decided during the 50-patch pilot
  selection_rule: >
    Approved 2026-09-15. Decided on the 50-patch pre-flight pilot WITHOUT using ground-truth agreement.
    Hierarchy: (1) structured parse success >= 0.95; (2) token-limit failures <= 0.02; (3) higher run-to-run
    judgement stability; (4) lower median latency; (5) lower monetary cost. Ground-truth agreement may be reported
    afterwards but never decides. Selected model frozen before the full experiment.
  max_tokens: 16000
  semantic_runs_per_patch: 3
  counterexample_calls_per_patch: 1       # one call returning K tests
  cache_key: [model, settings, max_tokens, prompt_sha256, context_sha256, patch_id, run]

prompts:
  semantic: prompts/semantic_v2.txt
  counterexample: prompts/counterexample_v2.txt
  memorization_probe: prompts/probe_v2.txt
  # sha256(semantic_prompt_sha256 + counterexample_prompt_sha256 + probe_prompt_sha256), each computed by
  # request_builders.load_prompt over just the SYSTEM/TEMPLATE/SCHEMA sections (not the STATUS header)
  sha256: 8c8e8ab6a2285a7814402476e4ee3b46732a1051bff6fc012de8611098ffb2d0

context:
  primary_condition: C
  conditions:
    A: candidate diff only
    B: candidate diff + trigger test names + buggy failure messages
    C: B + changed buggy methods, signatures, containing class declaration, referenced fields, imports, direct helpers
  failure_message_caps: {per_message_chars: 2000, total_chars: 8000}
  context_budget_input_tokens: 12000   # approved 2026-09-15; src/context_budget.py
  context_priority: [changed_method, candidate_diff, signatures, failing_tests, referenced_fields, helper_methods,
                     imports_types, surrounding_source]
  context_logging: [original_token_estimate, final_token_estimate, items_removed, over_budget, truncation_reason]

scores:
  S_sem:
    per_run: "confidence if judgement == CORRECT else 1 - confidence (confidence clipped to [0,1], clipping logged)"
    aggregate: mean over runs
    decision: "CORRECT if S_sem_final >= 0.5 else OVERFITTING"
    overfitting_score: 1 - S_sem_final
  S_cex:
    K: 3
    valid_tests: status == VALID_BUG_REVEALING
    validation_sequence: >
      Approved 2026-09-15. compile (fail -> INVALID_COMPILE); fixed once (fail -> INVALID_ORACLE, timeout -> TIMEOUT,
      stop); buggy once (pass -> VALID_NON_DISCRIMINATING, stop); only for fixed PASS + buggy FAIL run repetitions
      2 and 3 on fixed and buggy (all stable -> VALID_BUG_REVEALING, otherwise FLAKY); then candidate once per valid
      test (PASS / FAIL / TIMEOUT).
    funnel: [generated, syntactically_valid, compiled, fixed_pass, buggy_fail, stable_bug_revealing, candidate_discriminating]
    funnel_breakdowns: [project, ground_truth_label, patch_size]
    missingness_report: [overall, project, ground_truth_label, patch_size]
    formula: passed_on_candidate / n_valid
    candidate_timeout: counts as not passed
    zero_valid: NA (never imputed)
  S_edit:
    primary: min(1, gumtree_edit_actions / ast_nodes_of_changed_buggy_methods)
    fallback: min(1, changed_executable_loc / executable_loc_of_changed_buggy_methods)
  S_vuln:
    formula: min(1, sum(weight[severity] for new warnings))
    new_warnings: candidate_multiset - buggy_multiset, key = (bug_type, class, method_signature, field_or_variable)
    severity_from_spotbugs_rank: {HIGH: [1, 4], MEDIUM: [5, 9], LOW: [10, 20]}
    weights: {HIGH: 1.0, MEDIUM: 0.5, LOW: 0.25}      # provisional primary
    sensitivity_scheme: equal weight per new warning
    decision_rule: >
      Approved 2026-09-15. Inspect real SpotBugs/FindSecBugs output on the smoke test first. If native rank/priority
      supports a defensible HIGH/MEDIUM/LOW mapping, the weighted scheme is primary; otherwise equal weights become
      primary. Decision documented before the 50-patch pilot.
    record_fields: [warning_id, category, rank, priority, severity, source_location, buggy_present, candidate_present, new]
    analyzer_failure: missing (never zero)
    custom_ast_checks_severity: MEDIUM
  PVS:
    formula: "alpha*S_sem + beta*S_cex - gamma*S_edit - delta*S_vuln"
    weight_constraints: "alpha, beta, gamma, delta >= 0; sum = 1"
    implementation_score: PVS_star   # approved 2026-09-15
    missing_S_cex_strategy: shifted_renormalized_recommended
    missing_S_cex_options:
      directive_renormalized: "(alpha*S_sem - gamma*S_edit - delta*S_vuln) / (alpha + gamma + delta)"
      shifted_renormalized_recommended: >
        [alpha*S_sem + beta*S_cex + gamma*(1-S_edit) + delta*(1-S_vuln)] / sum(weights of available components);
        equals PVS + gamma + delta when all components exist (identical ranking), stays in [0,1] when S_cex is NA
    sensitivity: missingness-indicator logistic model
  weights_until_human_preferences: "exploratory supervised calibration (labels), LOPO training folds only"

static_analysis:
  source_parsing: JavaParser
  cfg_ir: SootUp
  pdg: intraprocedural reaching definitions + post-dominance-frontier control dependence on SootUp Jimple
  analysis_level_hierarchy:   # approved 2026-09-15; stored per candidate; Level 3 is never called PDG
    - PDG        # real PDG / code property graph (SootUp) where reliable
    - DATAFLOW   # CFG + reaching definitions / def-use
    - CFG_AST    # CFG + AST structural analysis
    - FAILED
  coverage_fields: [cfg_success, pdg_success, dataflow_success, spotbugs_success, findsecbugs_success]
  fallback_ir: WALA
  ast_diff: GumTree
  warnings: [SpotBugs, FindSecBugs]
  versions: configs/tools.lock

preferences:
  comparisons: 240
  raters: 3
  calibration: Bradley-Terry on PVS component differences, constrained weights, training-fold projects only
  status: PENDING until real human data exist

evaluation:
  positive_class: overfitting
  primary_split: leave-one-project-out (Chart, Closure, Lang, Math, Time)
  secondary_split: GroupKFold by bug_id, 5 folds, seed 2026
  classifier_for_combinations: logistic regression, default hyperparameters (C=1.0), standardized inside training fold, threshold 0.5, no tuning
  methods: [M0 majority, M1 random stratified, M2 diff-feature baseline, M3 semantic, M4 counterexample, M5 static,
            M6 sem+cex, M7 sem+static, M8 cex+static, M9 sem+cex+static, M10 full PVS with human preferences]
  metrics: [precision, recall, f1, macro_f1, specificity, correct_patch_retention, balanced_accuracy, mcc, auroc,
            average_precision, confusion_matrix]
  ranking: {primary: conditional_precision_at_1, secondary: end_to_end_precision_at_1,
            also: [theoretical_max_p1, random_expected_p1, mrr, top3]}
  bootstrap: {type: cluster by bug_id, resamples: 10000, seed: 2026, paired_for_differences: true}
  improvement_claim_rule: "95% CI of the paired difference excludes zero"
  exploratory_only: [patch-level McNemar]
  seeds: [2026, 2027, 2028, 2029, 2030]

staging:
  - stage0: local unit tests
  - stage1: 10-patch end-to-end smoke test (engineering only)
  - stage2: ~50-patch stratified pre-flight pilot (project x label x size tercile)
  - stage3: author review of PRE_FLIGHT_REPORT_V2.md
  - stage4: full experiment only after approval
